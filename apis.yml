name: morewis
description: Morewis (摩尔元数) is a Chinese industrial software company founded in 2017 and
  headquartered in Xiamen, Fujian, that develops cloud-based Manufacturing Execution System (MES)
  and Manufacturing Operations Management (MOM) software for the manufacturing sector. Its Morewis
  Cloud industrial internet platform, MoreDEV low-code development platform (including the WisIDE
  cloud IDE), and MoreAgent / N³ industrial AI large model let manufacturers build and run
  smart-factory applications with reduced hand coding. Reference clients include Haier, Hisense,
  Aisino, Inspur, and 3Trees Group. The company raised a ~100M yuan Series B led by Qiming Venture
  Partners. No public English-language REST API, OpenAPI, SDK, or GitHub organization was found;
  the developer surface is a China-hosted low-code industrial application platform.
